display_text: "Water Treatment"
modality: multi  # 'image', 'sensor', or 'multi'

nc: 4
names:
  0: non_irrigated
  1: flood
  2: sprinkler
  3: drip

inference:
  handler: openvino_image_text_classify
  task: classify
  device: GPU
  input_mode: multi
  ticket_images: true
  preview_channels: [0, 1, 2]
  preview_percentiles: [2, 98]

  image_model_path: models/ov_models/water_treatment/image.xml
  text_model_path: models/ov_models/water_treatment/text.xml
  preprocessing_path: models/ov_models/water_treatment/preprocessing.joblib
  manifest_path: datasets/water_treatment/manifest.csv

  fusion_weights:
    image: 0.5
    text: 0.5

sqlite:
  db_path: out/water_treatment/sql_data/detections.db
  clear_on_run: true
  clear_outputs: true

agents:
  active: [policy, analysis, evidence]
  confidence_threshold: 0.5
  report_top_n: 5
  execution_mode: sequential
  shared_device: GPU

  policy:
    llm_mode: model
    model_id: models/ov_models/llms/Phi-4-mini-instruct-int4gq
    device: GPU

  analysis:
    llm_mode: model
    model_id: models/ov_models/llms/Phi-4-mini-instruct-int4gq
    device: GPU

  evidence:
    llm_mode: model
    model_id: models/ov_models/llms/Phi-4-mini-instruct-int4gq
    device: GPU

glue:
  mode: model
  model_id: models/ov_models/llms/Phi-4-mini-instruct-int4gq
  device: GPU
  max_steps: 4
  verbose: true
  enable_cache: false
  suppress_thinking: true

sql:
  model_id: models/ov_models/llms/sqlcoder-7b-2-int4cw
  device: GPU
  use_case: water_treatment

schema:
  table_name: detections
  columns:
    - name: id
      type: INTEGER PRIMARY KEY AUTOINCREMENT
      required: false
    - name: image_id
      type: INTEGER
      required: false
    - name: source
      type: TEXT
      required: true
    - name: state
      type: TEXT
      required: true
    - name: label
      type: TEXT
      required: true
    - name: confidence
      type: REAL
      required: true
    - name: image_confidence
      type: REAL
      required: false
    - name: text_confidence
      type: REAL
      required: false
    - name: image_features_json
      type: TEXT
      required: false
    - name: text_prompt
      type: TEXT
      required: true
    - name: patch_path
      type: TEXT
      required: false
    - name: created_at
      type: TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      required: false
  indexes:
    - label
    - confidence
    - state
    - source

detection_mapping:
  image_id: image_id
  source: source
  state: state
  label: label
  confidence: confidence
  image_confidence: image_confidence
  text_confidence: text_confidence
  image_features_json: image_features_json
  text_prompt: text_prompt
  patch_path: patch_path